name: Bug report
description: Report a reproducible defect without sensitive data
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include credentials, private code, personal data, or production logs. Report security issues privately as described in SECURITY.md."
  - type: textarea
    id: symptom
    attributes:
      label: Symptom and expected behavior
      description: Describe what happened and what should have happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide synthetic steps, command, exit code, and a stable failure signature.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Relevant environment
      description: Include only non-sensitive facts such as OS, Python version, and agent surface.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, personal data, private code, and production logs.
          required: true
        - label: This is not a vulnerability report.
          required: true
